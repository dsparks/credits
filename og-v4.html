<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 400px; height: 400px; overflow: hidden;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="heatmap"></canvas>
<script>
(function() {
  var canvas = document.getElementById('heatmap');
  var dpr = window.devicePixelRatio || 1;
  var S = 360, COLS = 10, ROWS = 10;
  canvas.width  = Math.round(S * dpr);
  canvas.height = Math.round(S * dpr);
  canvas.style.width  = S + 'px';
  canvas.style.height = S + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var cw = S / COLS, ch = S / ROWS, gap = 3.5;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var d = c - r;
      var v = d < 0 ? 0 : Math.max(0, 1 - d / COLS);
      ctx.fillStyle = v > 0
        ? 'rgba(0,122,51,' + (0.12 + v * 0.88).toFixed(2) + ')'
        : 'rgba(0,0,0,0.05)';
      ctx.fillRect(c * cw + gap / 2, r * ch + gap / 2, cw - gap, ch - gap);
    }
  }
})();
</script>
</body>
</html>
